fedora:
  box: 'cloud-image/fedora-43'
  box_version: ''
  pkg_update: 'dnf upgrade -y'
  pkg_install: 'dnf install -y'
  devel_pkgs: 'curl git gcc gcc-c++ make wget ca-certificates gnupg2'
  sudo_group: 'wheel'
  extra_pkgs: 'bc sysstat psmisc'
  routinator_version: ''
  fort_build_from_source: ''
  fort_version: ''

debian:
  box: 'cloud-image/debian-13'
  box_version: ''
  pkg_update: 'apt update && apt full-upgrade -y'
  pkg_install: 'apt install -y'
  devel_pkgs: 'curl git build-essential sudo wget apt-transport-https ca-certificates gnupg lsb-release'
  sudo_group: 'sudo'
  extra_pkgs: 'bc sysstat psmisc'
  routinator_version: ''
  fort_build_from_source: ''
  fort_version: ''

debian12:
  box: 'debian/bookworm64'
  box_version: ''
  pkg_update: 'apt update && apt full-upgrade -y'
  pkg_install: 'apt install -y'
  devel_pkgs: 'curl git build-essential sudo wget apt-transport-https ca-certificates gnupg lsb-release'
  sudo_group: 'sudo'
  extra_pkgs: 'bc sysstat psmisc'
  routinator_version: '0.15.3-1bookworm'
  fort_build_from_source: 'true'
  fort_version: '1.6.2'

ubuntu:
  box: 'ubuntu/jammy64'
  box_version: '20241002.0.0'
  pkg_update: 'apt update && apt full-upgrade -y'
  pkg_install: 'apt install -y'
  devel_pkgs: 'curl git build-essential wget apt-transport-https ca-certificates software-properties-common gnupg lsb-release'
  sudo_group: 'sudo'
  extra_pkgs: ''
  routinator_version: ''
  fort_build_from_source: ''
  fort_version: ''
